<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SARYAM Travel History Map</title>
<style>
html,body,#map{height:100%;width:100%;margin:0;padding:0}
body{font-family:Arial,Helvetica,sans-serif;background:#edf7f0}
#map{min-height:235px}
.map-message{height:100%;min-height:235px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center;color:#456b57;font-size:14px;line-height:1.5;background:#edf7f0;box-sizing:border-box}
.map-message small{margin-top:8px;color:#7a9486;font-size:11px;word-break:break-all;max-width:90%}
.gm-style .gm-style-iw-c{border-radius:10px;padding:12px!important}
.info{min-width:190px;max-width:270px;color:#234b37;font-size:13px;line-height:1.5}
.info h3{margin:0 0 7px;color:#006b40;font-size:15px}
.info .route{margin:5px 0;overflow-wrap:anywhere}
.info .meta{color:#5d7466}
.info strong{color:#006b40}
.map-note{position:absolute;left:8px;bottom:8px;z-index:2;background:#fffc;padding:3px 8px;border-radius:6px;font:11px Arial;color:#456b57}
</style>
</head>
<body>
<div id="map"><div class="map-message">Loading saved travel locations…</div></div>
<script>
/* Hosted on GitHub Pages and embedded in the Zoho Creator dashboard iframe.
   Accepted data formats (in the URL query string OR the #hash):
   1) ?trips=<JSON array>                      (raw or URL-encoded)
   2) ?d=<base64 of JSON array>                (URL-safe base64 allowed)
   3) ?t=emp|date|start|end|km|mode|cost~emp|date|...   (compact, records split by ~ , fields by |)
   JSON keys used: employee, date, start, end, distance, mode, cost  */
const MAPS_API_KEY = "AIzaSyCUT-r7jJAO_J84KRlqfuXJCXuEwthTPgo";
const MAX_TRIPS = 8;

function escapeHtml(v){
  return String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function showMessage(message, detail){
  const el=document.getElementById("map");
  if(el) el.innerHTML='<div class="map-message">'+escapeHtml(message)+(detail?'<small>'+escapeHtml(detail)+'</small>':'')+'</div>';
}
function safeDecode(s){
  try{ return decodeURIComponent(s.replace(/\+/g," ")); }catch(e){ return s; }
}
function getParams(){
  const p=new URLSearchParams(window.location.search);
  const h=new URLSearchParams((window.location.hash||"").replace(/^#/,""));
  const get=k=>p.get(k)||h.get(k)||"";
  return {trips:get("trips"), d:get("d"), t:get("t")};
}
function normalise(t){
  t=t||{};
  return {
    employee:t.employee||t.emp||t.name||"",
    date:t.date||"",
    start:t.start||t.from||"",
    end:t.end||t.to||t.destination||"",
    distance:t.distance||t.km||"0",
    mode:t.mode||t.vehicle||"",
    cost:t.cost||"0"
  };
}
function parseJsonLoose(raw){
  const tries=[raw, safeDecode(raw)];
  for(const s of tries){
    try{
      const v=JSON.parse(s);
      if(Array.isArray(v)) return v;
      if(v && Array.isArray(v.trips)) return v.trips;
    }catch(e){}
  }
  /* Deluge-style text such as [{employee=A, start=B}] cannot be parsed reliably */
  return null;
}
function readTrips(){
  const {trips,d,t}=getParams();
  let list=null;
  if(trips){ list=parseJsonLoose(trips); }
  if(!list && d){
    try{
      let b=d.replace(/-/g,"+").replace(/_/g,"/");
      while(b.length%4) b+="=";
      const json=decodeURIComponent(escape(atob(b)));
      list=parseJsonLoose(json);
    }catch(e){}
  }
  if(!list && t){
    list=safeDecode(t).split("~").filter(Boolean).map(rec=>{
      const f=rec.split("|").map(x=>x.trim());
      return {employee:f[0],date:f[1],start:f[2],end:f[3],distance:f[4],mode:f[5],cost:f[6]};
    });
  }
  return (list||[]).map(normalise).filter(x=>x.start&&x.end).slice(0,MAX_TRIPS);
}
function infoHtml(trip,kind){
  return '<div class="info">'+
    '<h3>'+escapeHtml(trip.employee || "Employee trip")+'</h3>'+
    '<div class="meta">'+escapeHtml(trip.date || "")+' · '+(kind==="start"?"Starting point":"Destination")+'</div>'+
    '<div class="route"><strong>From:</strong> '+escapeHtml(trip.start || "-")+'</div>'+
    '<div class="route"><strong>To:</strong> '+escapeHtml(trip.end || "-")+'</div>'+
    '<div class="meta"><strong>Distance:</strong> '+escapeHtml(trip.distance || "0")+' km<br>'+
    '<strong>Vehicle:</strong> '+escapeHtml(trip.mode || "-")+'<br>'+
    '<strong>Cost:</strong> ₹'+escapeHtml(trip.cost || "0")+'</div>'+
    '</div>';
}

function initMap(){
  const trips=readTrips();
  if(!trips.length){
    const q=(window.location.search||"")+(window.location.hash||"");
    showMessage("No usable trip data was received by the map.",
      "Received "+q.length+" characters in the URL. Make sure each trip has a start and destination address.");
    return;
  }

  const map=new google.maps.Map(document.getElementById("map"),{
    center:{lat:13.0827,lng:80.2707},
    zoom:10,
    mapTypeControl:false,
    streetViewControl:false,
    fullscreenControl:true,
    clickableIcons:false,
    gestureHandling:"greedy",
    styles:[
      {featureType:"poi",elementType:"labels",stylers:[{visibility:"off"}]},
      {featureType:"transit",elementType:"labels",stylers:[{visibility:"off"}]}
    ]
  });

  const geocoder=new google.maps.Geocoder();
  const bounds=new google.maps.LatLngBounds();
  const infoWindow=new google.maps.InfoWindow();
  const addressCache=new Map();
  const routeColors=["#007342","#00A85A","#168C72","#398B58","#0B6B53","#4A9B72"];
  let plotted=0, lastStatus="";

  function locate(address){
    const key=String(address||"").trim().toLowerCase();
    if(!key) return Promise.resolve(null);
    if(addressCache.has(key)) return addressCache.get(key);
    const req=new Promise(resolve=>{
      geocoder.geocode({address:address},(results,status)=>{
        if(status==="OK" && results && results[0]) resolve(results[0].geometry.location);
        else { lastStatus=status; resolve(null); }
      });
    });
    addressCache.set(key,req);
    return req;
  }

  function addMarker(position,trip,kind){
    const isStart=kind==="start";
    const marker=new google.maps.Marker({
      map:map, position:position,
      title:(isStart?"Start":"Destination")+" · "+(trip.employee||"Employee trip"),
      icon:{path:google.maps.SymbolPath.CIRCLE,scale:9,fillColor:isStart?"#007342":"#E65B50",fillOpacity:1,strokeColor:"#ffffff",strokeWeight:2},
      zIndex:isStart?2:3
    });
    const open=()=>{ infoWindow.setContent(infoHtml(trip,kind)); infoWindow.open({map:map,anchor:marker}); };
    marker.addListener("mouseover",open);
    marker.addListener("click",open);
    bounds.extend(position);
  }

  async function plotAll(){
    for(let i=0;i<trips.length;i++){
      const trip=trips[i];
      const s=await locate(trip.start);
      const e=await locate(trip.end);
      if(s && e){
        addMarker(s,trip,"start");
        addMarker(e,trip,"end");
        new google.maps.Polyline({path:[s,e],geodesic:true,strokeColor:routeColors[i%routeColors.length],strokeOpacity:.72,strokeWeight:3,map:map});
        plotted++;
      }
      if(i<trips.length-1) await new Promise(r=>setTimeout(r,120));
    }
    if(plotted>0){
      map.fitBounds(bounds,35);
      if(plotted===1) map.setZoom(12);
    }else{
      showMessage("Trip data was received, but the addresses could not be located.",
        lastStatus?("Geocoder status: "+lastStatus+(lastStatus==="REQUEST_DENIED"?" – enable the Geocoding API and check key restrictions.":"")):"");
    }
  }
  plotAll();
}

/* Google calls this if the key is rejected (billing, referrer restriction, API not enabled) */
window.gm_authFailure=function(){
  showMessage("Google Maps rejected the API key.","Check: Maps JavaScript API + Geocoding API enabled, billing on, and https://saryam-source.github.io/* allowed in the key's HTTP referrer list.");
};

(function loadMaps(){
  const s=document.createElement("script");
  s.src="https://maps.googleapis.com/maps/api/js?key="+encodeURIComponent(MAPS_API_KEY)+"&callback=initMap";
  s.async=true; s.defer=true;
  s.onerror=()=>showMessage("Google Maps could not be loaded.","Check network connection and the API key restrictions.");
  document.head.appendChild(s);
})();
</script>
</body>
</html>
