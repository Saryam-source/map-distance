<!DOCTYPE html>
<html>
<head>
<title>Zoho Forms PDF Template Update Tracker</title>
<style>
body{font-family:Arial,sans-serif;padding:20px;color:#000;}
h1{text-align:center;color:#0b376d;font-size:24px;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th{background:#0b376d;color:#fff;padding:8px;border:1px solid #000;}
td{border:1px solid #000;padding:6px;vertical-align:middle;}
.center{text-align:center;}
input[type="checkbox"]{width:18px;height:18px;cursor:pointer;}
input[type="date"], input[type="text"]{width:95%;padding:4px;border:1px solid #aaa;}
button{padding:10px 18px;background:#0b376d;color:#fff;border:0;border-radius:4px;cursor:pointer;margin-bottom:15px;}
@media print{button{display:none;}}
</style>
</head>

<body>

<button onclick="downloadWord()">Download Word</button>

<div id="content">
<h1>ZOHO FORMS PDF TEMPLATE UPDATE TRACKER</h1>

<table>
<thead>
<tr>
<th>S.No</th>
<th>Form Name</th>
<th>Checked<br>Date</th>
<th>Updated</th>
<th>Completed<br>Date</th>
<th>Issue</th>
</tr>
</thead>
<tbody id="body"></tbody>
</table>
</div>

<script>
const forms = [
"Material/Tools Returned from Site",
"Travel Expense Forms",
"Travel Advance Request Form (TARF)",
"Service Report",
"Installation Report",
"Site Work Report (Weekly)",
"Leave Travel Allowance (LTA) Claim Form",
"Advance Request Form",
"Monthly Expense",
"Additional Requirement Form",
"Extended Work Report",
"Final Acceptance Certificate",
"Material Loss / Damage / Repair Report",
"Minutes of Meeting (MOM)",
"No Dues Form",
"Employee Information",
"Work Compensation Form (WCF)",
"Kilometer Calculate Form",
"Jenoptik Service Report"
];

let html = "";
forms.forEach((name, i) => {
html += `
<tr>
<td class="center">${i+1}</td>
<td>${name}</td>
<td class="center">
<input type="checkbox"><br><br>
<input type="date">
</td>
<td><input type="text" placeholder="Enter update"></td>
<td class="center">
<input type="checkbox"><br><br>
<input type="date">
</td>
<td><input type="text" placeholder="Enter issue"></td>
</tr>`;
});
document.getElementById("body").innerHTML = html;

function downloadWord(){
  let clone = document.getElementById("content").cloneNode(true);

  clone.querySelectorAll("input").forEach(input => {
    let span = document.createElement("span");

    if(input.type === "checkbox"){
      span.innerHTML = input.checked ? "☑" : "☐";
      span.style.fontSize = "18px";
    } else {
      span.innerHTML = input.value || "__________";
    }

    input.parentNode.replaceChild(span, input);
  });

  let word = `
  <html>
  <head><meta charset="utf-8"></head>
  <body>${clone.innerHTML}</body>
  </html>`;

  let blob = new Blob(["\ufeff", word], {type:"application/msword"});
  let a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "Zoho_Forms_PDF_Template_Update_Tracker.doc";
  a.click();
}
</script>

</body>
</html>
