<!DOCTYPE html>
<html>
<head>
<title>Zoho Forms Tracker</title>
<style>
body{
  font-family: Arial, sans-serif;
  padding:20px;
}
h1{
  text-align:center;
  color:#0b376d;
  font-size:24px;
}
table{
  width:100%;
  border-collapse:collapse;
  table-layout:fixed;
  font-size:12px;
}
th{
  background:#0b376d;
  color:white;
  border:1px solid #000;
  padding:8px;
  text-align:center;
}
td{
  border:1px solid #000;
  padding:6px;
  vertical-align:middle;
}
.center{text-align:center;}
input[type="checkbox"]{width:18px;height:18px;}
input[type="text"],input[type="date"]{
  width:90%;
  padding:4px;
}
button{
  background:#0b376d;
  color:white;
  padding:10px 18px;
  border:0;
  border-radius:4px;
  margin-bottom:15px;
}
@media print{
  button{display:none;}
  @page{size:landscape;margin:10mm;}
}
</style>
</head>
<body>

<button onclick="window.print()">Print / Save as PDF</button>

<h1>ZOHO FORMS PDF TEMPLATE UPDATE TRACKER</h1>

<table>
<thead>
<tr>
<th style="width:5%;">S.No</th>
<th style="width:28%;">Form Name</th>
<th style="width:13%;">Checked<br>Date</th>
<th style="width:18%;">Updated</th>
<th style="width:13%;">Completed<br>Date</th>
<th style="width:23%;">Issue</th>
</tr>
</thead>
<tbody id="tableBody"></tbody>
</table>

<script>
const forms=[
"Material/Tools Returned from Site",
"Travel Expense Forms",
"Travel Advance Request Form (TARF)",
"Service Report",
"Installation Report",
"Site Work Report (Weekly)",
"Leave Travel Allowance (LTA) Claim Form",
"Advance Request Form",
"Monthly Expense",
"Additional Requirement Form",
"Extended Work Report",
"Final Acceptance Certificate",
"Material Loss / Damage / Repair Report",
"Minutes of Meeting (MOM)",
"No Dues Form",
"Employee Information",
"Work Compensation Form (WCF)",
"Kilometer Calculate Form",
"Jenoptik Service Report"
];

let html="";
forms.forEach((form,i)=>{
html+=`
<tr>
<td class="center">${i+1}</td>
<td>${form}</td>
<td class="center">
<input type="checkbox"><br><br>
<input type="date">
</td>
<td><input type="text" placeholder="Enter update"></td>
<td class="center">
<input type="checkbox"><br><br>
<input type="date">
</td>
<td><input type="text" placeholder="Enter issue"></td>
</tr>`;
});
document.getElementById("tableBody").innerHTML=html;
</script>

</body>
</html>
